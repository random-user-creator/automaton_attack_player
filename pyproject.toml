[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "automaton-attack-player"
version = "0.1.0"
description = "Low-latency screen capture, OCR, and typing assistant for Automaton Attack."
readme = "README.md"
requires-python = ">=3.13,<3.14"

[project.scripts]
automaton-attack-player = "dota_word_game.main:main"

[tool.setuptools.packages.find]
where = ["src"]
